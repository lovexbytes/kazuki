name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun test --isolate

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            target: bun-darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64-baseline
            target: bun-darwin-x64-baseline
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            target: bun-linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x64-baseline
            target: bun-linux-x64-baseline
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Build and check version
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bun build --compile Term.ts --target=${{ matrix.target }} --outfile kazuki
          test "$(./kazuki version)" = "kazuki ${tag#v}"
      - name: Smoke outside checkout
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          pid=
          trap 'test -z "$pid" || kill "$pid" 2>/dev/null || true; rm -rf "$work"' EXIT
          cp kazuki "$work/kazuki"
          cd "$work"
          export KAZUKI_DIR="$work/data" KAZUKI_SITE=http://127.0.0.1:9876
          mkdir -p "$KAZUKI_DIR"
          ./kazuki serve 9876 >server.log 2>&1 &
          pid=$!
          for n in {1..100}; do curl -fsS http://127.0.0.1:9876/ >/dev/null && break; sleep .05; done
          curl -fsS http://127.0.0.1:9876/ >/dev/null
          curl -fsS http://127.0.0.1:9876/app.js >/dev/null
          curl -fsS http://127.0.0.1:9876/install.sh >/dev/null
          kill "$pid"
          wait "$pid" || true
      - name: Archive binary
        run: tar -czf kazuki-${{ matrix.platform }}.tar.gz kazuki
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kazuki-${{ matrix.platform }}
          path: kazuki-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          shopt -s nullglob
          assets=(artifacts/*/*.tar.gz)
          expected=(kazuki-darwin-aarch64.tar.gz kazuki-darwin-x64-baseline.tar.gz kazuki-linux-aarch64.tar.gz kazuki-linux-x64-baseline.tar.gz)
          test ${#assets[@]} -eq ${#expected[@]}
          for name in "${expected[@]}"; do
            matches=(artifacts/*/"$name")
            test ${#matches[@]} -eq 1
            cp "${matches[0]}" "$name"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            kazuki-*.tar.gz
            SHA256SUMS
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag SHA256SUMS kazuki-*.tar.gz
